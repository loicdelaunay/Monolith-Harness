name: Desktop compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: dotnet build src/MonolithHarness.App -f net10.0-desktop -c Release
      - if: runner.os == 'Windows'
        run: dotnet build src/MonolithHarness.App -f net10.0-windows10.0.19041.0 -c Release
      - run: dotnet run --project tests/MonolithHarness.Tests -c Release
      - run: dotnet run --project tests/MonolithHarness.Cli.Tests -c Release
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Publish GUI
        run: dotnet publish src/MonolithHarness.App -f net10.0-desktop -p:MonolithHarnessDesktopOnly=true -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/GUI
      - name: Publish CLI
        run: dotnet publish src/MonolithHarness.Cli -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/CLI
      - name: Package clean portable downloads
        shell: pwsh
        run: ./build/package-release.ps1 -Runtime ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: MonolithHarness-${{ matrix.rid }}
          path: artifacts/TEMP/release-packages/GUI/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: MonolithHarness-CLI-${{ matrix.rid }}
          path: artifacts/TEMP/release-packages/CLI/*
          if-no-files-found: error
          compression-level: 0
  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Fedora build and GUI runtime packages
        run: dnf install -y git git-lfs dotnet-sdk-10.0 nodejs npm tar gzip fontconfig libXrandr libXi mesa-libGL dbus-daemon gtk3 webkit2gtk4.1 xorg-x11-server-Xvfb
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Fedora versions
        run: |
          cat /etc/fedora-release
          dotnet --version
          node --version
      - run: dotnet build src/MonolithHarness.App -f net10.0-desktop -c Release
      - run: dotnet run --project tests/MonolithHarness.Tests -c Release
      - run: dotnet run --project tests/MonolithHarness.Cli.Tests -c Release
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Publish GUI
        run: dotnet publish src/MonolithHarness.App -f net10.0-desktop -p:MonolithHarnessDesktopOnly=true -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/GUI
      - name: Publish CLI
        run: dotnet publish src/MonolithHarness.Cli -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/CLI
      - name: Smoke-test Fedora executables
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/MonolithHarness.Cli/MonolithHarness.Cli.csproj | head -n 1)"
          test -n "$version"
          ./artifacts/CLI/MonolithHarness --version | grep -F "$version"
          smoke_dir="$(mktemp -d)"
          trap 'kill "$xvfb_pid" 2>/dev/null || true; rm -rf "$smoke_dir"' EXIT
          Xvfb :99 -screen 0 1280x800x24 > "$smoke_dir/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          if ! DISPLAY=:99 MONOLITHHARNESS_UI_SMOKE="$smoke_dir" MONOLITHHARNESS_UX_SMOKE=1 timeout 60s ./artifacts/GUI/MonolithHarness; then
            if test -f "$smoke_dir/smoke-error.txt"; then cat "$smoke_dir/smoke-error.txt"; fi
            cat "$smoke_dir/xvfb.log"
            exit 1
          fi
          if test -f "$smoke_dir/smoke-error.txt"; then cat "$smoke_dir/smoke-error.txt"; exit 1; fi
          test -f "$smoke_dir/smoke-ok.txt"
          cat "$smoke_dir/smoke-ok.txt"
      - name: Package clean Fedora downloads
        run: bash ./build/package-fedora.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MonolithHarness-linux-x64
          path: artifacts/TEMP/release-packages/GUI/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: MonolithHarness-CLI-linux-x64
          path: artifacts/TEMP/release-packages/CLI/*
          if-no-files-found: error
          compression-level: 0
