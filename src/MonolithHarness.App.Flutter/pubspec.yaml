name: monolith_harness_app_flutter
description: "Monolith Android: native Flutter Material chat, skills and local web apps."
publish_to: 'none'
version: 2.1.1+153

environment:
  sdk: ^3.13.1

dependencies:
  flutter_localizations:
    sdk: flutter
  device_info_plus: ^13.3.0
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.7
  http: ^1.6.0
  markdown: ^7.3.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  sqflite: ^2.4.4+1
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/web/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#16181D"
  adaptive_icon_foreground: assets/logo.png
  min_sdk_android: 26
